# ==============================================================================
# HaiHire VPS Host Nginx Edge Configuration (Two-Layer Reverse Proxy)
# ==============================================================================
# Layer 1 (Host Nginx): Terminates TLS/SSL (Certbot), handles custom domain,
#                       and forwards traffic over loopback to Layer 2 (Caddy).
# Layer 2 (Docker Caddy): Routes /api/*, /organizations/*, /events/* -> api:3001
#                         and all other routes -> web:3000.
#
# Usage on VPS:
#   1. Copy to /etc/nginx/sites-available/haihire-staging.conf
#   2. Replace staging.example.com with your actual domain
#   3. ln -sf /etc/nginx/sites-available/haihire-staging.conf /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. certbot --nginx -d staging.example.com
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name staging.example.com;

    # Match Caddy's 15MB request body limit (CV uploads up to 10MB + multipart overhead)
    client_max_body_size 15m;

    # Real-time Server-Sent Events (SSE) — disable response buffering completely
    location /events/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Standard HTTP + Next.js App Router + API routes + WebSockets
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
