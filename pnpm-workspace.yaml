packages:
  - "apps/*"
  - "packages/*"
catalog:
  "@types/node": ^26.6.7
  "@vitest/coverage-v8": 5.1.1
  eslint: ^10.15.0
  prettier: ^3.10.1
  tsx: ^4.23.15
  typescript: ^6.0.3
  vitest: 5.1.1
  zod: ^4.6.7
overrides:
  body-parser: ">=2.4.0"
  effect: ">=3.22.1 <4.0.0" # GHSA-7589-6fvf-x4pw (via prisma/@prisma/config)
  fast-uri: "^3.1.9"
  fast-xml-parser: "^5.12.1"
  follow-redirects: ">=1.16.2"
  ip-address: "^10.7.6"
  "minimatch@>=7.0.0 <11.0.1": ">=11.0.1" # GHSA-g3hv-75wg-m249 (via shadcn/ts-morph)
  source-map-js: ">=1.2.2"
  # NOTE: stream-json is kept on ^1.8.0 because minio@8.0.7 imports stream-json/jsonl/Parser.js (capital P, missing in 3.x ESM on Linux).
  decode-uri-component: ">=0.5.1"
  systeminformation: ">=5.33.16"
  undici: ">=7.30.1"
  qs: ">=6.16.1"
  vite: "^8.3.8"
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
  workerd: true
  prisma: true
  "@prisma/engines": true
minimumReleaseAge: 1440
