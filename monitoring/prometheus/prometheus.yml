global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: "haihire-backend"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["api:3001"]
    authorization:
      type: "Bearer"
      credentials: "${METRICS_TOKEN}"

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
