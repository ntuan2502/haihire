  "@vitest/coverage-v8": 5.1.0
  eslint: ^10.14.0
  prettier: ^3.9.10
  tsx: ^4.23.15
  typescript: ^6.0.3
  vitest: 5.1.0
  zod: ^4.6.7
overrides:
  follow-redirects: ">=1.16.2"
  source-map-js: ">=1.2.2"
  decode-uri-component: ">=0.5.1"
