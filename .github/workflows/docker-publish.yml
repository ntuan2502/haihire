name: Build & Publish Container Images (GHCR)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version Tag (e.g., v1.0.0)'
        required: false
        type: string

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/haihire-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/haihire-frontend

jobs:
  # ============================================================================
  # 1. PRE-RELEASE AUTOMATED QUALITY GATES
  # ============================================================================
  test:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: haihire_test
          POSTGRES_PASSWORD: haihire_test_password
          POSTGRES_DB: haihire_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haihire_test -d haihire_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:8.0.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 26
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install pnpm 12
        run: npm install -g pnpm@12

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI environment files
        run: |
          cat > .env << 'EOF'
          NODE_ENV=test
          BACKEND_PORT=13001
          FRONTEND_PORT=13000
          POSTGRES_PORT=15432
          MINIO_PORT=19000
          MINIO_CONSOLE_PORT=19001
          REDIS_PORT=16379
          POSTGRES_USER=haihire_test
          POSTGRES_PASSWORD=haihire_test_password
          POSTGRES_DB=haihire_test_db
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          REDIS_PASSWORD=
          EOF

          cat > backend/.env << 'EOF'
          PORT=3001
          DATABASE_URL=postgresql://haihire_test:haihire_test_password@localhost:5432/haihire_test_db?schema=public
          JWT_SECRET=ci-test-jwt-secret-minimum-16-chars
          ENCRYPTION_SECRET=ci-test-encryption-secret-must-be-32-characters-long
          DEMO_SEED_PASSWORD=dev-seed-password-2026
          FRONTEND_URL=http://localhost:3000
          MINIO_ENDPOINT=localhost
          MINIO_PORT=9000
          MINIO_USE_SSL=false
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin
          MINIO_BUCKET_NAME=haihire-resumes
          MINIO_PUBLIC_URL=http://localhost:9000
          SYSTEM_EMAIL_PROVIDER=SIMULATED
          SYSTEM_EMAIL_FROM_NAME=HaiHire CI
          SYSTEM_EMAIL_FROM_EMAIL=ci@haihire.test
          SYSTEM_EMAIL_SMTP_HOST=
          SYSTEM_EMAIL_SMTP_PORT=587
          SYSTEM_EMAIL_SMTP_USER=
          SYSTEM_EMAIL_SMTP_PASS=
          SYSTEM_EMAIL_RESEND_API_KEY=
          SYSTEM_EMAIL_SENDGRID_API_KEY=
          REDIS_PORT=6379
          EOF

          cat > frontend/.env << 'EOF'
          PORT=3000
          INTERNAL_API_URL=http://localhost:3001
          NEXT_PUBLIC_API_URL=http://localhost:3001
          NEXT_PUBLIC_MINIO_URL=/haihire-resumes
          NEXT_PUBLIC_DEMO_SEED_PASSWORD=dev-seed-password-2026
          EOF

      - name: Run Full CI Verification Pipeline
        run: pnpm check:all

  # ============================================================================
  # 1.5. PRE-RELEASE PLAYWRIGHT END-TO-END VERIFICATION
  # ============================================================================
  test-e2e:
    name: Verify Playwright E2E Before Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: "true"
      PLAYWRIGHT_BASE_URL: "http://localhost:13000"

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: haihire_test
          POSTGRES_PASSWORD: haihire_test_password
          POSTGRES_DB: haihire_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haihire_test -d haihire_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:8.0.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 26
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install pnpm 12
        run: npm install -g pnpm@12

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI environment files
        run: |
          cat > .env << 'EOF'
          NODE_ENV=test
          BACKEND_PORT=13001
          FRONTEND_PORT=13000
          POSTGRES_PORT=5432
          POSTGRES_USER=haihire_test
          POSTGRES_PASSWORD=haihire_test_password
          POSTGRES_DB=haihire_test_db
          REDIS_PORT=6379
          EOF

          cat > backend/.env << 'EOF'
          PORT=13001
          DATABASE_URL=postgresql://haihire_test:haihire_test_password@localhost:5432/haihire_test_db?schema=public
          JWT_SECRET=ci-test-jwt-secret-minimum-16-chars
          ENCRYPTION_SECRET=ci-test-encryption-secret-must-be-32-characters-long
          DEMO_SEED_PASSWORD=dev-seed-password-2026
          FRONTEND_URL=http://localhost:13000
          MINIO_ENDPOINT=localhost
          MINIO_PORT=9000
          MINIO_USE_SSL=false
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin
          MINIO_BUCKET_NAME=haihire-resumes
          MINIO_PUBLIC_URL=http://localhost:9000
          SYSTEM_EMAIL_PROVIDER=SIMULATED
          SYSTEM_EMAIL_FROM_NAME=HaiHire CI
          SYSTEM_EMAIL_FROM_EMAIL=ci@haihire.test
          SYSTEM_EMAIL_SMTP_HOST=
          SYSTEM_EMAIL_SMTP_PORT=587
          SYSTEM_EMAIL_SMTP_USER=
          SYSTEM_EMAIL_SMTP_PASS=
          SYSTEM_EMAIL_RESEND_API_KEY=
          SYSTEM_EMAIL_SENDGRID_API_KEY=
          REDIS_PORT=6379
          EOF

          cat > frontend/.env << 'EOF'
          PORT=13000
          INTERNAL_API_URL=http://localhost:13001
          NEXT_PUBLIC_API_URL=http://localhost:13001
          NEXT_PUBLIC_MINIO_URL=/haihire-resumes
          NEXT_PUBLIC_DEMO_SEED_PASSWORD=dev-seed-password-2026
          EOF

      - name: Initialize Database Schema & Seed Data
        run: |
          pnpm --filter ./backend run db:update
          pnpm --filter ./backend run seed

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Pre-build application
        run: pnpm build

      - name: Pre-start services in background & wait for healthcheck
        run: |
          pnpm dev &
          echo "Waiting for services to become healthy on http://localhost:13000..."
          timeout 120s bash -c 'until curl -sf http://localhost:13000 > /dev/null; do sleep 2; done'
          echo "Services are ready!"

      - name: Run Playwright E2E Tests
        run: pnpm test:e2e

      - name: Upload Playwright test report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-playwright-report
          path: playwright-report/

  # ============================================================================
  # 2. BUILD & PUBLISH BACKEND CONTAINER IMAGE
  # ============================================================================
  build-backend:
    name: Build & Push Backend Image
    needs: [test, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Backend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. BUILD & PUBLISH FRONTEND CONTAINER IMAGE
  # ============================================================================
  build-frontend:
    name: Build & Push Frontend Image
    needs: [test, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '' }}
            NEXT_PUBLIC_MINIO_URL=${{ vars.NEXT_PUBLIC_MINIO_URL || '/haihire-resumes' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 4. GITHUB RELEASE & DEPLOYMENT INSTRUCTIONS
  # ============================================================================
  release:
    name: Create GitHub Release
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve Release Tag Name
        id: vars
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "TAG_NAME=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release with Deployment Instructions
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "Release ${{ steps.vars.outputs.TAG_NAME }}"
          generate_release_notes: true
          body: |
            ## 🚀 HaiHire Enterprise ATS Release ${{ steps.vars.outputs.TAG_NAME }}

            Pre-built, immutable production container images have been published to GitHub Container Registry (GHCR):

            ```bash
            # Pull backend and frontend images
            docker pull ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.TAG_NAME }}
            docker pull ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.TAG_NAME }}
            ```

            ### 📦 Production Deployment Steps
            1. Configure `.env.production` on target host:
               ```bash
               cp .env.production.example .env.production
               # Set GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
               # Set IMAGE_TAG=${{ steps.vars.outputs.TAG_NAME }}
               ```
            2. Pull immutable container images:
               ```bash
               docker compose --env-file .env.production -f docker-compose.prod.yml pull
               ```
            3. Start the production stack:
               ```bash
               pnpm docker:prod:up
               ```
            4. Verify deployment health:
               ```bash
               curl -i http://localhost:3001/health
               ```
