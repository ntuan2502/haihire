name: haihire-prod

x-logging: &prod-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ------------------------------------------------------------------------------
  # 1. PostgreSQL Database Service (Internal Network Only - No Exposed Ports)
  # ------------------------------------------------------------------------------
  postgres:
    image: postgres:17.6-alpine
    container_name: haihire-prod-postgres
    restart: unless-stopped
    env_file:
      - path: ./.env.production
        required: false
      - path: ./.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - haihire-prod-network
    logging: *prod-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------------------
  # 2. Valkey Cache & Async Job Queue (Internal Network Only - No Exposed Ports)
  # ------------------------------------------------------------------------------
  redis:
    image: valkey/valkey:8.0.2-alpine
    container_name: haihire-prod-redis
    restart: unless-stopped
    env_file:
      - path: ./.env.production
        required: false
      - path: ./.env
        required: false
    # maxmemory-policy noeviction để đảm bảo BullMQ jobs không bị evict.
    # Khi memory đầy, Valkey sẽ reject write thay vì mất data.
    # Monitor memory usage qua metric và alert nếu gần full.
    # maxmemory 384mb được định kích thước an toàn dưới container limit 512M,
    # chừa lại 128MB cho Linux Alpine OS, network buffer và background fork snapshot.
    command: >
      /bin/sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          valkey-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 384mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec;
        else
          valkey-server --maxmemory 384mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec;
        fi
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - haihire-prod-network
    logging: *prod-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: [ "CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------------------
  # 3. MinIO S3 Object Storage (Internal API Network - No Direct Host Ports)
  # ------------------------------------------------------------------------------
  minio:
    image: alpine/minio@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4
    container_name: haihire-prod-minio
    restart: unless-stopped
    env_file:
      - path: ./.env.production
        required: false
      - path: ./.env
        required: false
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - haihire-prod-network
    logging: *prod-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 128M
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/minio/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------------------
  # 4. NestJS Production Backend Service
  # ------------------------------------------------------------------------------
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-ntuan2502}/haihire-backend:${IMAGE_TAG:-v1.0.0}
    container_name: haihire-prod-backend
    restart: unless-stopped
    env_file:
      - path: ./.env.production
        required: false
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-haihire-resumes}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      SYSTEM_EMAIL_PROVIDER: ${SYSTEM_EMAIL_PROVIDER:-SMTP}
      SYSTEM_EMAIL_FROM_NAME: ${SYSTEM_EMAIL_FROM_NAME}
      SYSTEM_EMAIL_FROM_EMAIL: ${SYSTEM_EMAIL_FROM_EMAIL}
      SYSTEM_EMAIL_SMTP_HOST: ${SYSTEM_EMAIL_SMTP_HOST:-}
      SYSTEM_EMAIL_SMTP_PORT: ${SYSTEM_EMAIL_SMTP_PORT:-587}
      SYSTEM_EMAIL_SMTP_USER: ${SYSTEM_EMAIL_SMTP_USER:-}
      SYSTEM_EMAIL_SMTP_PASS: ${SYSTEM_EMAIL_SMTP_PASS:-}
      SYSTEM_EMAIL_RESEND_API_KEY: ${SYSTEM_EMAIL_RESEND_API_KEY:-}
      SYSTEM_EMAIL_SENDGRID_API_KEY: ${SYSTEM_EMAIL_SENDGRID_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *prod-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:3001/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - haihire-prod-network

  # ------------------------------------------------------------------------------
  # 5. Next.js Production Frontend Service
  # ------------------------------------------------------------------------------
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-ntuan2502}/haihire-frontend:${IMAGE_TAG:-v1.0.0}
    container_name: haihire-prod-frontend
    restart: unless-stopped
    env_file:
      - path: ./.env.production
        required: false
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://localhost:3001}
      INTERNAL_API_URL: http://backend:3001
      BACKEND_HOST: backend
      BACKEND_PORT: 3001
      MINIO_HOST: minio
      MINIO_PORT: 9000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    logging: *prod-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - haihire-prod-network

  # ------------------------------------------------------------------------------
  # 6. MinIO Orphan File Cleanup Cron Service (Runs daily at 04:00 AM)
  # ------------------------------------------------------------------------------
  orphan-cleanup:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-ntuan2502}/haihire-backend:${IMAGE_TAG:-v1.0.0}
    container_name: haihire-prod-orphan-cleanup
    restart: unless-stopped
    env_file:
      - path: ./.env.production
        required: false
      - path: ./.env
        required: false
    command: >
      /bin/sh -c "
        echo '0 4 * * * cd /app && node --import tsx scripts/cleanup-orphan-minio.ts >> /var/log/orphan-cleanup.log 2>&1' > /etc/crontabs/root &&
        crond -f -l 2
      "
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-haihire-resumes}
      PUSHGATEWAY_URL: ${PUSHGATEWAY_URL:-http://pushgateway:9091}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - haihire-prod-network
    logging: *prod-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ------------------------------------------------------------------------------
  # 7. Prometheus Pushgateway Service (Metrics for Batch & Cron Jobs)
  # ------------------------------------------------------------------------------
  pushgateway:
    image: prom/pushgateway:v1.10.0
    container_name: haihire-prod-pushgateway
    restart: unless-stopped
    ports:
      - "${PUSHGATEWAY_PORT:-9091}:9091"
    networks:
      - haihire-prod-network
    logging: *prod-logging
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9091/-/healthy" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    name: haihire_prod_postgres_data
    driver: local
  redis_data:
    name: haihire_prod_redis_data
    driver: local
  minio_data:
    name: haihire_prod_minio_data
    driver: local

networks:
  haihire-prod-network:
    name: haihire_prod_network
    driver: bridge
