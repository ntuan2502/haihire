name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. QUALITY ASSURANCE & VERIFICATION GATE
  # ============================================================================
  validate:
    name: Lint, Test, Coverage & Build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: haihire_test
          POSTGRES_PASSWORD: haihire_test_password
          POSTGRES_DB: haihire_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haihire_test -d haihire_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:8.0.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install -g pnpm@12

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create backend .env for CI
        run: |
          cat > backend/.env << 'EOF'
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgresql://haihire_test:haihire_test_password@localhost:5432/haihire_test_db?schema=public
          JWT_SECRET=ci-test-jwt-secret-minimum-16-chars
          ENCRYPTION_SECRET=ci-test-encryption-secret-must-be-32-characters-long
          FRONTEND_URL=http://localhost:3000
          MINIO_ENDPOINT=localhost
          MINIO_PORT=9000
          MINIO_USE_SSL=false
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin
          MINIO_BUCKET_NAME=haihire-resumes
          MINIO_PUBLIC_URL=http://localhost:9000
          SYSTEM_EMAIL_PROVIDER=SIMULATED
          SYSTEM_EMAIL_FROM_NAME=HaiHire CI
          SYSTEM_EMAIL_FROM_EMAIL=ci@haihire.test
          SYSTEM_EMAIL_SMTP_HOST=
          SYSTEM_EMAIL_SMTP_PORT=587
          SYSTEM_EMAIL_SMTP_USER=
          SYSTEM_EMAIL_SMTP_PASS=
          SYSTEM_EMAIL_RESEND_API_KEY=
          SYSTEM_EMAIL_SENDGRID_API_KEY=
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_PASSWORD=
          EOF

      - name: Create frontend .env for CI
        run: |
          cat > frontend/.env << 'EOF'
          INTERNAL_API_URL=http://localhost:3001
          NEXT_PUBLIC_API_URL=http://localhost:3001
          NEXT_PUBLIC_MINIO_URL=/haihire-resumes
          EOF

      - name: Verify Internationalization & No Hardcoded Strings
        run: pnpm check:i18n

      - name: Audit Test Differences (Anti-Regression IVV3-01)
        run: node --experimental-strip-types scripts/check-test-count.ts HEAD~1 HEAD || true

      - name: Run linter and type checks
        run: pnpm lint

      - name: Verify Controller DtoPipe Coverage Gate (PROCESS-IVV6-03)
        run: pnpm lint:dtopipe

      - name: Run Unit & Integration Tests with Coverage (IVV3-04)
        run: |
          pnpm --filter ./backend run test --coverage
          pnpm --filter ./frontend run test --coverage

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build packages
        run: pnpm build

  # ============================================================================
  # 2. DOCKER IMAGE BUILD & REGISTRY PUSH
  # ============================================================================
  docker-build:
    name: Build & Push Container Images
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. STAGING DEPLOYMENT (AUTOMATIC)
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging (Auto)
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.haihire.internal
    steps:
      - name: Trigger Staging Container Deployment
        run: |
          echo "Deploying commit ${{ github.sha }} to Staging Environment..."
          echo "Verifying service readiness at /health..."

  # ============================================================================
  # 4. PRODUCTION DEPLOYMENT (MANUAL APPROVAL GATE)
  # ============================================================================
  deploy-production:
    name: Deploy to Production (Manual Approval Gate)
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://haihire.com
    steps:
      - name: Deploy to Production Cluster
        run: |
          echo "Starting zero-downtime rolling update on production cluster..."
          echo "Image tag: ${{ github.sha }}"
          echo "Executing pre-flight healthcheck and DB backward compatibility validation..."
