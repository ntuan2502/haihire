name: E2E Weekly Verification

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 3AM UTC (weekly)
  workflow_dispatch:

concurrency:
  group: e2e-weekly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Full Weekly Playwright E2E Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: "true"
      PLAYWRIGHT_BASE_URL: "http://localhost:8080"

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: haihire_test
          POSTGRES_PASSWORD: haihire_test_password
          POSTGRES_DB: haihire_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haihire_test -d haihire_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:8.0.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup E2E Runtime & Services
        uses: ./.github/actions/setup-e2e

      - name: Run Playwright E2E Tests
        run: pnpm test:e2e

      - name: Upload Playwright test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: weekly-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
