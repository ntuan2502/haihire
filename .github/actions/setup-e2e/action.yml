name: Setup HaiHire E2E Runtime
description: Configure E2E env, start MinIO, migrate and seed PostgreSQL, build apps, and boot services

runs:
  using: composite
  steps:
    - name: Setup Single Root Environment for E2E
      shell: bash
      run: |
        cp .env.example .env
        sed -i 's/POSTGRES_USER=haihire_user/POSTGRES_USER=haihire_test/g' .env
        sed -i 's/POSTGRES_PASSWORD=haihire_password/POSTGRES_PASSWORD=haihire_test_password/g' .env
        sed -i 's/POSTGRES_DB=haihire_db/POSTGRES_DB=haihire_test_db/g' .env
        sed -i 's/postgresql:\/\/haihire_user:haihire_password@localhost:5432\/haihire_db/postgresql:\/\/haihire_test:haihire_test_password@localhost:5432\/haihire_test_db/g' .env
        sed -i 's/NODE_ENV=development/NODE_ENV=test/g' .env
        pnpm db:generate

    - name: Start MinIO Object Storage & Wait for Readiness
      shell: bash
      run: |
        docker run -d --name minio \
          --user 0:0 \
          -v minio_data:/data \
          -p 9000:9000 -p 9001:9001 \
          -e MINIO_ROOT_USER=minioadmin \
          -e MINIO_ROOT_PASSWORD=minioadmin \
          alpine/minio@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4 \
          server /data --console-address ":9001"

        timeout 60s bash -c '
          until curl -sf http://localhost:9000/minio/health/live > /dev/null; do
            if ! docker ps | grep -q minio; then
              echo "❌ MinIO container stopped unexpectedly!"
              docker logs minio
              exit 1
            fi
            sleep 2
          done
        '
        echo "MinIO ready on port 9000!"

    - name: Wait for Redis/Valkey Readiness
      shell: bash
      run: |
        timeout 60s bash -c 'until (exec 3<>/dev/tcp/localhost/6379) 2>/dev/null; do sleep 1; done'
        echo "Redis ready on port 6379!"

    - name: Run Database Migrations & Seed
      shell: bash
      run: |
        pnpm db:migrate
        pnpm --filter api run db:seed
      env:
        DATABASE_URL: postgresql://haihire_test:haihire_test_password@localhost:5432/haihire_test_db?schema=public
        DEMO_SEED_PASSWORD: dev-seed-password-2026

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright Browsers
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: Cache Next.js build
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/apps/web/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

    - name: Pre-build application
      shell: bash
      run: pnpm build

    - name: Start Caddy App Gateway & Backend/Frontend Services
      shell: bash
      run: |
        docker run -d --name gateway \
          -p 8080:80 \
          --add-host host.docker.internal:host-gateway \
          -e API_UPSTREAM=host.docker.internal:3001 \
          -e WEB_UPSTREAM=host.docker.internal:3000 \
          -v "${{ github.workspace }}/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
          caddy:2-alpine

        nohup pnpm start > /tmp/haihire-e2e.log 2>&1 &
        timeout 180s bash -c '
          until curl -sf http://localhost:8080/gateway-health > /dev/null && curl -sf http://localhost:8080/api/health > /dev/null && curl -sf http://localhost:8080/auth/login > /dev/null; do
            sleep 3
          done
        '
        echo "Services & Caddy gateway ready on port 8080!"
