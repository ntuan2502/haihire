groups:
  - name: haihire-production-alerts
    rules:
      - alert: HaiHireBackendDown
        expr: up{job="haihire-backend"} == 0
        for: 1m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "HaiHire Backend API instance is down"
          description: "HaiHire backend instance has been unreachable for more than 1 minute. See runbook: docs/runbooks/alerts.md"

      - alert: HaiHirePostgresDown
        expr: haihire_service_health{service="postgres"} == 0
        for: 30s
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "PostgreSQL database health check failed"
          description: "Database connection has failed or timed out for >30s. See runbook: docs/runbooks/alerts.md"

      - alert: HaiHireRedisDown
        expr: haihire_service_health{service="redis"} == 0
        for: 30s
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "Redis cache / queue health check failed"
          description: "Redis instance ping failed for >30s. See runbook: docs/runbooks/redis-recovery.md"

      - alert: HaiHireMinioDown
        expr: haihire_service_health{service="minio"} == 0
        for: 1m
        labels:
          severity: high
          team: sre
        annotations:
          summary: "MinIO S3 storage health check failed"
          description: "MinIO storage bucket check failed for >1m. See runbook: docs/runbooks/alerts.md"

      - alert: HaiHireHighHttp5xxErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100 > 5
        for: 2m
        labels:
          severity: high
          team: sre
        annotations:
          summary: "High HTTP 5xx error rate (>5%)"
          description: "HTTP 5xx error rate is {{ $value | printf \"%.2f\" }}% over the last 5 minutes. See runbook: docs/runbooks/alerts.md"

      - alert: HaiHireHighHttpLatencyP95
        expr: http_request_duration_ms{quantile="0.95"} > 1000
        for: 3m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "High HTTP request latency (P95 > 1000ms)"
          description: "95th percentile request latency exceeded 1000ms for 3 minutes. See runbook: docs/runbooks/alerts.md"

      - alert: HaiHireHighRateLimit429Rate
        expr: rate(http_requests_total{status="429"}[5m]) > 50
        for: 2m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "High volume of rate-limited requests"
          description: "Over 50 requests/sec are receiving HTTP 429 Too Many Requests (possible DDoS or brute-force). See runbook: docs/runbooks/alerts.md"

      - alert: HaiHireBullMqDlqGrowing
        expr: bullmq_queue_depth{queue="orphan-cleanup-dlq",state="waiting"} > 10
        for: 5m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "DLQ is accumulating ({{ $value }} jobs)"
          description: |
            DLQ orphan-cleanup-dlq has more than 10 waiting jobs for 5 minutes.
            Investigate MinIO connectivity and DLQ worker status.
            See runbook: docs/runbooks/dlq-recovery.md

      - alert: HaiHireBullMqDlqCritical
        expr: bullmq_queue_depth{queue="orphan-cleanup-dlq",state="waiting"} > 100
        for: 2m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "CRITICAL: DLQ >100 jobs — risk of MinIO storage leakage"
          description: |
            DLQ orphan-cleanup-dlq has more than 100 waiting jobs.
            Escalate immediately. Check MinIO health and trigger manual cleanup.
            See runbook: docs/runbooks/dlq-recovery.md

      - alert: HaiHireEmailQueueBacklog
        expr: bullmq_queue_depth{queue="email-queue",state="waiting"} > 500
        for: 10m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "Email queue backlog >500 jobs"
          description: |
            Email queue has more than 500 waiting jobs for 10 minutes.
            Check email provider connectivity and worker throughput.
            See runbook: docs/runbooks/email-queue.md

      - alert: HaiHireBullMqRedisDown
        expr: bullmq_queue_depth{queue="orphan-cleanup-queue",state="waiting"} == -1
        for: 2m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "CRITICAL: BullMQ cannot connect to Valkey/Redis"
          description: |
            Metric bullmq_queue_depth returned -1, indicating MetricsService
            failed to fetch BullMQ queue data within 2.5s.
            Inspect Valkey/Redis connectivity immediately.
            See runbook: docs/runbooks/redis-recovery.md

      - alert: HaiHireOrphanCleanupSpikeWarning
        expr: minio_orphan_cleanup_orphans_found_total > 50
        for: 0m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "Orphan cleanup detected {{ $value }} orphan files"
          description: |
            Cron cleanup detected over 50 orphan files in its last run.
            Investigate root cause before the 30-day grace period expires.
            Could be due to upload flow bug or MinIO connectivity issue.
            See runbook: docs/runbooks/dlq-recovery.md

      - alert: HaiHireOrphanCleanupSpikeCritical
        expr: minio_orphan_cleanup_orphans_found_total > 500
        for: 0m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "CRITICAL: {{ $value }} orphan files — possible upload flow regression"
          description: |
            Cron cleanup detected over 500 orphan files in its last run.
            Escalate immediately. Check MinIO connectivity and Saga rollback logic.
            Possible production incident occurring.
            See runbook: docs/runbooks/dlq-recovery.md

      - alert: HaiHireOrphanCleanupCronMissing
        expr: time() - minio_orphan_cleanup_last_run_timestamp_seconds > 90000
        for: 5m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "Orphan cleanup cron has not run in over 25 hours"
          description: |
            Last run timestamp of orphan cleanup cron exceeds 25 hours (90000s).
            Cron is scheduled to run daily at 4:00 AM. If not running,
            orphan files accumulate without being purged.
            Check if the orphan-cleanup container is running.
            See runbook: docs/runbooks/dlq-recovery.md
