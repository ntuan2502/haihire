name: Release & Container Publishing (GHCR)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic Version Tag (e.g. v0.1.0)"
        required: false
        type: string

concurrency:
  group: cd-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/haihire-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/haihire-web

jobs:
  # ============================================================================
  # 1. BUILD & PUBLISH CONTAINER IMAGES TO GHCR
  # ============================================================================
  publish-images:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest
    outputs:
      tag-name: ${{ steps.vars.outputs.TAG_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve Release Tag Name
        id: vars
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "TAG_NAME=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.TAG_NAME }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ !contains(steps.vars.outputs.TAG_NAME, 'alpha') && !contains(steps.vars.outputs.TAG_NAME, 'beta') }}

      - name: Build and push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.TAG_NAME }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ !contains(steps.vars.outputs.TAG_NAME, 'alpha') && !contains(steps.vars.outputs.TAG_NAME, 'beta') }}

      - name: Build and push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. CONTAINER IMAGE VULNERABILITY SCAN (TRIVY)
  # ============================================================================
  trivy-scan:
    name: Container Vulnerability Scan
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Block Release on API CRITICAL Vulnerabilities (D-015 verified)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.API_IMAGE }}:${{ needs.publish-images.outputs.tag-name }}
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Scanner on API Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.API_IMAGE }}:${{ needs.publish-images.outputs.tag-name }}
          format: "sarif"
          output: "trivy-api-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload API SARIF Report (Code Scanning)
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: false
        if: always()
        with:
          sarif_file: "trivy-api-results.sarif"
          category: "trivy-api"

      - name: Block Release on Web CRITICAL Vulnerabilities (D-015 verified)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.WEB_IMAGE }}:${{ needs.publish-images.outputs.tag-name }}
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Scanner on Web Image
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ env.WEB_IMAGE }}:${{ needs.publish-images.outputs.tag-name }}
          format: "sarif"
          output: "trivy-web-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Web SARIF Report (Code Scanning)
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: false
        if: always()
        with:
          sarif_file: "trivy-web-results.sarif"
          category: "trivy-web"

      - name: Archive SARIF Vulnerability Reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: trivy-container-sarif-reports
          path: |
            trivy-api-results.sarif
            trivy-web-results.sarif
          if-no-files-found: ignore

  # ============================================================================
  # 3. CREATE GITHUB RELEASE
  # ============================================================================
  create-release:
    name: Publish GitHub Release
    needs: [publish-images, trivy-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.publish-images.outputs.tag-name }}
          name: "HaiHire Enterprise ATS ${{ needs.publish-images.outputs.tag-name }}"
          generate_release_notes: true
          draft: false
          prerelease: true
          body: |
            ## 🚀 HaiHire Enterprise ATS ${{ needs.publish-images.outputs.tag-name }}

            Pre-built, immutable production container images have been published to GitHub Container Registry (GHCR):
            - `${{ env.API_IMAGE }}:${{ needs.publish-images.outputs.tag-name }}`
            - `${{ env.WEB_IMAGE }}:${{ needs.publish-images.outputs.tag-name }}`

            ### 📦 Manual Deployment Procedure
            ```bash
            # 1. Pull immutable container images
            IMAGE_TAG=${{ needs.publish-images.outputs.tag-name }} docker compose --env-file .env.production -f docker-compose.prod.yml pull

            # 2. Deploy with rolling container update
            IMAGE_TAG=${{ needs.publish-images.outputs.tag-name }} docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans

            # 3. Verify health
            curl -i http://localhost:13001/health
            ```
            *Refer to `docs/runbooks/ci-cd.md` for operational deployment and rollback SOPs.*
