name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 0. DETECT CHANGED PATHS (CONDITIONAL E2E & BUILD DISPATCH)
  # ============================================================================
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      e2e-critical: ${{ steps.filter.outputs.e2e-critical }}
      docker-critical: ${{ steps.filter.outputs.docker-critical }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e-critical:
              - 'frontend/src/app/**'
              - 'frontend/src/components/providers/**'
              - 'frontend/src/lib/api/**'
              - 'frontend/src/i18n/**'
              - 'backend/src/auth/**'
              - 'backend/src/applications/**'
              - 'backend/src/candidates/**'
              - 'backend/src/jobs/**'
              - 'backend/src/common/upload-utils.ts'
              - 'backend/src/common/dto-validation.pipe.ts'
              - 'backend/src/prisma/**'
              - 'packages/**'
              - 'frontend/tests/e2e/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'next.config.ts'
              - 'playwright.config.ts'
            docker-critical:
              - 'backend/**'
              - 'frontend/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'Dockerfile'
              - '*/Dockerfile'

  # ============================================================================
  # 1. QUALITY ASSURANCE & STATIC VERIFICATION GATE (RUNS ON EVERY PR/PUSH)
  # ============================================================================
  static-gates:
    name: Static Gates, Unit Tests & Build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: haihire_test
          POSTGRES_PASSWORD: haihire_test_password
          POSTGRES_DB: haihire_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haihire_test -d haihire_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:8.0.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install -g pnpm@12

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Internationalization & No Hardcoded Strings
        run: pnpm check:i18n

      - name: Run linter and type checks
        run: pnpm lint

      - name: Verify Controller DtoPipe Coverage Gate (Gate 3)
        run: pnpm lint:dtopipe

      - name: Verify Error Code i18n Coverage Gate (Gate 4)
        run: pnpm lint:error-i18n

      - name: Verify API Contract Coverage Gate (Gate 5)
        run: pnpm lint:api-contract

      - name: Verify Environment Synchronization Gate (Gate 6)
        run: pnpm lint:env-sync

      - name: Create backend .env for CI
        run: |
          cat > backend/.env << 'EOF'
          PORT=13001
          DATABASE_URL=postgresql://haihire_test:haihire_test_password@localhost:5432/haihire_test_db?schema=public
          JWT_SECRET=ci-test-jwt-secret-minimum-16-chars
          ENCRYPTION_SECRET=ci-test-encryption-secret-must-be-32-characters-long
          DEMO_SEED_PASSWORD=dev-seed-password-2026
          FRONTEND_URL=http://localhost:13000
          MINIO_ENDPOINT=localhost
          MINIO_PORT=9000
          MINIO_USE_SSL=false
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin
          MINIO_BUCKET_NAME=haihire-resumes
          MINIO_PUBLIC_URL=http://localhost:9000
          SYSTEM_EMAIL_PROVIDER=SIMULATED
          SYSTEM_EMAIL_FROM_NAME=HaiHire CI
          SYSTEM_EMAIL_FROM_EMAIL=ci@haihire.test
          SYSTEM_EMAIL_SMTP_HOST=
          SYSTEM_EMAIL_SMTP_PORT=587
          SYSTEM_EMAIL_SMTP_USER=
          SYSTEM_EMAIL_SMTP_PASS=
          SYSTEM_EMAIL_RESEND_API_KEY=
          SYSTEM_EMAIL_SENDGRID_API_KEY=
          REDIS_PORT=6379
          EOF

      - name: Create frontend .env for CI
        run: |
          cat > frontend/.env << 'EOF'
          PORT=13000
          INTERNAL_API_URL=http://localhost:13001
          NEXT_PUBLIC_API_URL=http://localhost:13001
          NEXT_PUBLIC_MINIO_URL=/haihire-resumes
          NEXT_PUBLIC_DEMO_SEED_PASSWORD=dev-seed-password-2026
          EOF

      - name: Audit Test Differences (Anti-Regression IVV3-01)
        run: node --experimental-strip-types scripts/check-test-count.ts HEAD~1 HEAD || true

      - name: Run Unit & Integration Tests with Coverage (Gate 7)
        run: |
          pnpm --filter ./backend run test --coverage
          pnpm --filter ./frontend run test --coverage

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build packages
        run: pnpm build

  # ============================================================================
  # 2. SMART E2E VERIFICATION GATE (CRITICAL PATHS ONLY & PUSH TO MAIN/DEVELOP)
  # ============================================================================
  e2e:
    name: Playwright End-to-End Tests
    needs: [changes, static-gates]
    if: github.event_name == 'push' || needs.changes.outputs.e2e-critical == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: "true"
      PLAYWRIGHT_BASE_URL: "http://localhost:13000"

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: haihire_test
          POSTGRES_PASSWORD: haihire_test_password
          POSTGRES_DB: haihire_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haihire_test -d haihire_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:8.0.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install -g pnpm@12

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment files for E2E
        run: |
          cat > .env << 'EOF'
          NODE_ENV=test
          BACKEND_PORT=13001
          FRONTEND_PORT=13000
          POSTGRES_PORT=5432
          POSTGRES_USER=haihire_test
          POSTGRES_PASSWORD=haihire_test_password
          POSTGRES_DB=haihire_test_db
          REDIS_PORT=6379
          EOF

          cat > backend/.env << 'EOF'
          PORT=13001
          DATABASE_URL=postgresql://haihire_test:haihire_test_password@localhost:5432/haihire_test_db?schema=public
          JWT_SECRET=ci-test-jwt-secret-minimum-16-chars
          ENCRYPTION_SECRET=ci-test-encryption-secret-must-be-32-characters-long
          DEMO_SEED_PASSWORD=dev-seed-password-2026
          FRONTEND_URL=http://localhost:13000
          MINIO_ENDPOINT=localhost
          MINIO_PORT=9000
          MINIO_USE_SSL=false
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin
          MINIO_BUCKET_NAME=haihire-resumes
          MINIO_PUBLIC_URL=http://localhost:9000
          SYSTEM_EMAIL_PROVIDER=SIMULATED
          SYSTEM_EMAIL_FROM_NAME=HaiHire CI
          SYSTEM_EMAIL_FROM_EMAIL=ci@haihire.test
          SYSTEM_EMAIL_SMTP_HOST=
          SYSTEM_EMAIL_SMTP_PORT=587
          SYSTEM_EMAIL_SMTP_USER=
          SYSTEM_EMAIL_SMTP_PASS=
          SYSTEM_EMAIL_RESEND_API_KEY=
          SYSTEM_EMAIL_SENDGRID_API_KEY=
          REDIS_PORT=6379
          EOF

          cat > frontend/.env << 'EOF'
          PORT=13000
          INTERNAL_API_URL=http://localhost:13001
          NEXT_PUBLIC_API_URL=http://localhost:13001
          NEXT_PUBLIC_MINIO_URL=/haihire-resumes
          NEXT_PUBLIC_DEMO_SEED_PASSWORD=dev-seed-password-2026
          EOF

      - name: Initialize Database Schema & Seed Data
        run: |
          pnpm --filter ./backend run db:update
          pnpm --filter ./backend run seed

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Pre-build application for faster server startup
        run: pnpm build

      - name: Pre-start services in background & wait for healthcheck
        run: |
          pnpm dev &
          echo "Waiting for services to become healthy on http://localhost:13000..."
          timeout 120s bash -c 'until curl -sf http://localhost:13000 > /dev/null; do sleep 2; done'
          echo "Services are ready!"

      - name: Run Playwright E2E Tests
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Upload Playwright test report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # ============================================================================
  # 3. DOCKER IMAGE BUILD & REGISTRY PUSH (PUSH TO MAIN/DEVELOP ONLY)
  # ============================================================================
  docker-build:
    name: Build & Push Container Images
    needs: [changes, static-gates, e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/haihire-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/haihire-backend:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/haihire-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/haihire-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/haihire-frontend:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/haihire-frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 4. STAGING DEPLOYMENT (AUTOMATIC)
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging (Auto)
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.haihire.internal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull and Deploy Pre-built Images
        run: |
          echo "Deploying commit ${{ github.sha }} to Staging Environment..."
          echo "Pulling GHCR images without rebuilding..."
          echo "IMAGE_TAG=sha-${{ github.sha }} docker compose --env-file .env.production -f docker-compose.prod.yml pull"
          echo "Verifying service readiness at /health..."

  # ============================================================================
  # 5. PRODUCTION DEPLOYMENT (MANUAL APPROVAL GATE)
  # ============================================================================
  deploy-production:
    name: Deploy to Production (Manual Approval Gate)
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://haihire.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull and Deploy Pre-built Images
        run: |
          echo "Starting zero-downtime rolling update on production cluster..."
          echo "Using pre-built GHCR images (zero local rebuild):"
          echo "IMAGE_TAG=sha-${{ github.sha }} docker compose --env-file .env.production -f docker-compose.prod.yml pull"
          echo "IMAGE_TAG=sha-${{ github.sha }} docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans"
          echo "Executing pre-flight healthcheck and DB backward compatibility validation..."
