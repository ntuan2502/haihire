volumes:
  postgres_data:
    name: haihire_postgres_data
    driver: local
  minio_data:
    name: haihire_minio_data
    driver: local
  redis_data:
    name: haihire_redis_data
    driver: local

networks:
  haihire-network:
    name: haihire_network
    driver: bridge
