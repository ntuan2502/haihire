name: Production Gatekeeper CI (Main Branch)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ============================================================================
  # 1. FULL ARCHITECTURAL & UNIT TEST VERIFICATION
  # ============================================================================
  full-check:
    name: Full CI Quality Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: haihire_test
          POSTGRES_PASSWORD: haihire_test_password
          POSTGRES_DB: haihire_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haihire_test -d haihire_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:8.0.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Setup CI Single Root Environment
        run: |
          cp .env.example .env
          sed -i 's/POSTGRES_USER=haihire_user/POSTGRES_USER=haihire_test/g' .env
          sed -i 's/POSTGRES_PASSWORD=haihire_password/POSTGRES_PASSWORD=haihire_test_password/g' .env
          sed -i 's/POSTGRES_DB=haihire_db/POSTGRES_DB=haihire_test_db/g' .env
          sed -i 's/postgresql:\/\/haihire_user:haihire_password@localhost:5432\/haihire_db/postgresql:\/\/haihire_test:haihire_test_password@localhost:5432\/haihire_test_db/g' .env
          sed -i 's/NODE_ENV=development/NODE_ENV=test/g' .env
          pnpm db:generate
          pnpm db:migrate

      - name: Run Full CI Architecture Checks & Tests
        run: pnpm check:all

  # ============================================================================
  # 2. SECURITY AUDIT: DIRECT DEPENDENCIES
  # ============================================================================
  security-audit:
    name: Dependency Security Audit
    needs: full-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Workspace (pnpm only)
        uses: ./.github/actions/setup-workspace
        with:
          install-deps: "false"

      - name: Audit Production Dependencies
        run: pnpm audit --audit-level=high --prod

  # ============================================================================
  # 3. PLAYWRIGHT END-TO-END GATE
  # ============================================================================
  e2e:
    name: Playwright End-to-End Suite
    needs: full-check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: "true"
      PLAYWRIGHT_BASE_URL: "http://localhost:13000"

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: haihire_test
          POSTGRES_PASSWORD: haihire_test_password
          POSTGRES_DB: haihire_test_db
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U haihire_test -d haihire_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:8.0.2-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup E2E Runtime & Services
        uses: ./.github/actions/setup-e2e

      - name: Run Playwright E2E Tests
        run: pnpm test:e2e

      - name: Upload Playwright test report on failure
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: main-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  # ============================================================================
  # 4. DOCKER BUILD DRY-RUN VERIFICATION (NO PUSH)
  # ============================================================================
  docker-verify:
    name: Docker Build Dry-Run Verification
    needs: full-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Container Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: test-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Backend Image Prisma Client & Bundle Import
        run: |
          docker run --rm test-backend:latest node -e "import('@prisma/client').then((m) => { if (typeof m.PrismaClient !== 'function') process.exit(1); console.log('PrismaClient verified'); })"

      - name: Verify Frontend Container Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: test-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
