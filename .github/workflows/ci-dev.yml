name: Integration CI (Dev Branch)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ============================================================================
  # 0. PATH FILTER DETECTION
  # ============================================================================
  path-filter:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs-only: ${{ steps.filter.outputs.docs-only }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect Changed Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
            docs-only:
              - 'docs/**'
              - '**.md'
              - '!**/*.spec.ts'
            docker:
              - 'apps/api/Dockerfile'
              - 'apps/web/Dockerfile'
              - 'apps/api/prisma.config.ts'
              - 'apps/api/src/prisma/schema.prisma'
              - 'pnpm-lock.yaml'

  # ============================================================================
  # 1. ARCHITECTURAL QUALITY GATES (THE 15 GATES)
  # ============================================================================
  ci-gates:
    name: 15 CI Architecture Gates
    needs: path-filter
    if: |
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && !contains(github.event.head_commit.message, 'Merge pull request'))) &&
      needs.path-filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup CI Single Root Environment
        run: |
          cp .env.example .env
          sed -i 's/POSTGRES_USER=haihire_user/POSTGRES_USER=haihire_test/g' .env
          sed -i 's/POSTGRES_PASSWORD=haihire_password/POSTGRES_PASSWORD=haihire_test_password/g' .env
          sed -i 's/POSTGRES_DB=haihire_db/POSTGRES_DB=haihire_test_db/g' .env
          sed -i 's/postgresql:\/\/haihire_user:haihire_password@localhost:5432\/haihire_db/postgresql:\/\/haihire_test:haihire_test_password@localhost:5432\/haihire_test_db/g' .env
          sed -i 's/NODE_ENV=development/NODE_ENV=test/g' .env
          pnpm db:generate

      - name: Run 15 Architecture Quality Gates (Fast)
        run: pnpm check:all:fast

  # ============================================================================
  # 2. FULL UNIT TESTS
  # ============================================================================
  unit-tests:
    name: Full Unit Tests & Anti-Regression
    needs: [path-filter, ci-gates]
    if: |
      needs.path-filter.outputs.code == 'true' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && !contains(github.event.head_commit.message, 'Merge pull request')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: haihire_test
          POSTGRES_PASSWORD: haihire_test_password
          POSTGRES_DB: haihire_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haihire_test -d haihire_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:8.0.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup CI Single Root Environment
        run: |
          cp .env.example .env
          sed -i 's/POSTGRES_USER=haihire_user/POSTGRES_USER=haihire_test/g' .env
          sed -i 's/POSTGRES_PASSWORD=haihire_password/POSTGRES_PASSWORD=haihire_test_password/g' .env
          sed -i 's/POSTGRES_DB=haihire_db/POSTGRES_DB=haihire_test_db/g' .env
          sed -i 's/postgresql:\/\/haihire_user:haihire_password@localhost:5432\/haihire_db/postgresql:\/\/haihire_test:haihire_test_password@localhost:5432\/haihire_test_db/g' .env
          sed -i 's/NODE_ENV=development/NODE_ENV=test/g' .env
          pnpm db:generate
          pnpm db:migrate

      - name: Run Full Unit & Integration Test Suite
        run: pnpm test

  # ============================================================================
  # 3. CONDITIONAL DOCKER BUILD DRY-RUN (DOCKERFILE OR PRISMA CHANGES)
  # ============================================================================
  docker-dry-run:
    name: Conditional Docker Build Check
    needs: [path-filter, ci-gates]
    if: |
      needs.path-filter.outputs.docker == 'true' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && !contains(github.event.head_commit.message, 'Merge pull request')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Container Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: test-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Backend Image Prisma Client & Bundle Import
        run: |
          docker run --rm test-backend:latest node -e "import('@prisma/client').then((m) => { if (typeof m.PrismaClient !== 'function') process.exit(1); console.log('PrismaClient verified'); })"

      - name: Verify Frontend Container Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: test-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 4. DOCUMENTATION VERIFICATION (DOCS-ONLY COMMITS)
  # ============================================================================
  docs-verify:
    name: Documentation Verification
    needs: path-filter
    if: |
      needs.path-filter.outputs.docs-only == 'true' &&
      needs.path-filter.outputs.code == 'false' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && !contains(github.event.head_commit.message, 'Merge pull request')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Documentation Links & Sync
        run: |
          pnpm lint:doc-links
          pnpm lint:doc-sync

      - name: Verify Two-Way i18n
        run: pnpm lint:i18n
