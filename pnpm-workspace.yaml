packages:
  - "backend"
  - "frontend"
  - "packages/*"
overrides:
  follow-redirects: ">=1.16.2"
  source-map-js: ">=1.2.2"
  decode-uri-component: ">=0.5.1"
  systeminformation: ">=5.33.16"
  undici: ">=7.30.1"
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
  workerd: true
  prisma: true
  "@prisma/engines": true
minimumReleaseAgeExclude:
  - "@next/env@16.3.8"
  - "@next/eslint-plugin-next@16.3.8"
  - "@next/swc-darwin-arm64@16.3.8"
  - "@next/swc-darwin-x64@16.3.8"
  - "@next/swc-linux-arm64-gnu@16.3.8"
  - "@next/swc-linux-arm64-musl@16.3.8"
  - "@next/swc-linux-x64-gnu@16.3.8"
  - "@next/swc-linux-x64-musl@16.3.8"
  - "@next/swc-win32-arm64-msvc@16.3.8"
  - "@next/swc-win32-x64-msvc@16.3.8"
  - bullmq@6.3.11
  - eslint-config-next@16.3.8
  - lucide-react@1.49.0
  - next@16.3.8
