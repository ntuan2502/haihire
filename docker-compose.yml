name: haihire

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17.6-alpine
    container_name: haihire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-haihire_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haihire_password}
      POSTGRES_DB: ${POSTGRES_DB:-haihire_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - haihire-network
    logging: *default-logging
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haihire_user} -d ${POSTGRES_DB:-haihire_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO Object Storage (S3 Compatible)
  minio:
    image: alpine/minio@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4
    container_name: haihire-minio
    user: "0:0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - haihire-network
    logging: *default-logging
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:$${PORT:-9000}/minio/health/live || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis / Valkey (Cache & Asynchronous Queue)
  redis:
    image: valkey/valkey:8.0.2-alpine
    container_name: haihire-redis
    restart: unless-stopped
    command: >
      /bin/sh -c "
        if [ -n \"$${REDIS_PASSWORD}\" ]; then
          redis-server --requirepass \"$${REDIS_PASSWORD}\";
        else
          redis-server;
        fi
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - haihire-network
    logging: *default-logging
    healthcheck:
      test: [ "CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # NestJS Backend Service
  backend:
    profiles: [ "app" ]
    init: true
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: haihire-backend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-haihire_user}:${POSTGRES_PASSWORD:-haihire_password}@postgres:5432/${POSTGRES_DB:-haihire_db}?schema=public
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_PUBLIC_URL: http://localhost:${MINIO_PORT:-9000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:$${PORT:-3001}/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - haihire-network

  # Next.js Frontend Service
  frontend:
    profiles: [ "app" ]
    init: true
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: haihire-frontend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-3001}
      INTERNAL_API_URL: http://backend:3001
      BACKEND_HOST: backend
      BACKEND_PORT: 3001
      MINIO_HOST: minio
      MINIO_PORT: 9000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    networks:
      - haihire-network

volumes:
  postgres_data:
    name: haihire_postgres_data
    driver: local
  minio_data:
    name: haihire_minio_data
    driver: local
  redis_data:
    name: haihire_redis_data
    driver: local

networks:
  haihire-network:
    name: haihire_network
    driver: bridge
