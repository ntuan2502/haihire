name: Release & Changelog

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Semantic Version Tag (e.g., v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Generate Release Notes & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Tag Name
        id: vars
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "TAG_NAME=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release with Changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "HaiHire Enterprise ATS Release ${{ steps.vars.outputs.TAG_NAME }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 🚀 HaiHire Enterprise ATS Release ${{ steps.vars.outputs.TAG_NAME }}

            ### 📦 Container Registry Deployment (GHCR)
            Pre-built, immutable production container images are available on GitHub Container Registry:
            - `ghcr.io/${{ github.repository }}/haihire-backend:${{ steps.vars.outputs.TAG_NAME }}`
            - `ghcr.io/${{ github.repository }}/haihire-frontend:${{ steps.vars.outputs.TAG_NAME }}`

            ### ⚙️ Quick Start
            ```bash
            # 1. Clone or pull deployment config
            git checkout ${{ steps.vars.outputs.TAG_NAME }}

            # 2. Configure environment
            cp .env.production.example .env.production
            # Ensure IMAGE_TAG=${{ steps.vars.outputs.TAG_NAME }}

            # 3. Pull immutable container images
            docker compose --env-file .env.production -f docker-compose.prod.yml pull

            # 4. Start production stack
            pnpm docker:prod:up
            ```

            ---
            *Automated release managed by HaiHire Release Engine.*

      - name: Notify Release (Optional Webhook)
        if: env.RELEASE_WEBHOOK_URL != ''
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🚀 HaiHire Enterprise ATS Release ${{ steps.vars.outputs.TAG_NAME }} published successfully!\"}" \
            "${RELEASE_WEBHOOK_URL}" || true
